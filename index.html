<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Welcome</title>
    <link rel="stylesheet" href="/styles/StyleSheet.css" />
</head>

<body>

    <h2>Order Form</h2>

    <form action="https://localhost:7296/api/Form/submit" method="post">

        <!-- Item name -->
        <label for="itemName">Item Name:</label>
        <input type="text" id="itemName" name="itemName" placeholder="Name" />
        <br><br>

        <!-- Time slot -->
        <p>Time Slot:</p>

        <input type="radio" id="slot1" name="timeslot" value="14:00-16:00" />
        <label for="slot1">14:00–16:00</label>

        <input type="radio" id="slot2" name="timeslot" value="17:00-19:00" />
        <label for="slot2">17:00–19:00</label>

        <input type="radio" id="slot3" name="timeslot" value="20:00-22:00" />
        <label for="slot3">20:00–22:00</label>

        <br><br>

        <!-- Receipt checkbox -->
        <input type="checkbox" id="receipt" name="receipt" value="yes" />
        <label for="receipt">I want a printed receipt</label>

        <br><br>

        <!-- Quantity -->
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1" max="112" step="1" />

        <br><br>

        <!-- Submit button -->
        <button type="submit">Submit</button>

    </form>

</body>
</html>
